name: Notify Builder

on:
  push:
    branches: [master]
  create:
  schedule:
    - cron: '0 6 * * *'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_dispatch: ${{ steps.main.outputs.should_dispatch }}
      version: ${{ steps.main.outputs.version }}
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch builder branch config
        run: |
          git fetch origin dockerize/master 2>/dev/null || true
          git show origin/dockerize/master:build-config.yml > /tmp/build-config.yml 2>/dev/null || true

      - name: Detect
        id: main
        run: |
          CURRENT_COMMIT=$(git rev-parse HEAD)
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")

          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_COMMIT=$(yq -r '.last_build.commit // ""' /tmp/build-config.yml 2>/dev/null || echo "")
            LAST_TAG=$(yq -r '.last_build.version // ""' /tmp/build-config.yml 2>/dev/null || echo "")
            if [ "$CURRENT_COMMIT" = "$LAST_COMMIT" ] && [ "$TAG" = "$LAST_TAG" ]; then
              echo "should_dispatch=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "should_dispatch=true" >> $GITHUB_OUTPUT
          echo "version=${TAG:-v$(date +%Y%m%d)-snapshot}" >> $GITHUB_OUTPUT
          echo "commit=$CURRENT_COMMIT" >> $GITHUB_OUTPUT

  dispatch:
    needs: detect
    if: needs.detect.outputs.should_dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build-release on dockerize/master
        env:
          GH_TOKEN: ${{ secrets.BUILDER_PAT }}
        run: |
          gh workflow run build-release.yml \
            --ref dockerize/master \
            --repo Lax/traffic-accounting-nginx-module \
            --field module=traffic-accounting-nginx-module \
            --field version="${{ needs.detect.outputs.version }}" \
            --field commit="${{ needs.detect.outputs.commit }}"
